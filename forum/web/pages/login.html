{{ define "base" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/index.css">
    <link rel="stylesheet" href="/static/css/login.css">
    <title>Forum - Login</title>
</head>
<body style="background-color: var(--bg-body);">
    <nav class="nav-bar-cont">
        <div class="display-nav-bar">
            <a href="/" class="logo">Forum</a>
            <div class="display-btns">
                <a href="/register"><button class="btn sign-up-btn">Sign Up</button></a>
            </div>
        </div>
    </nav>

    <main class="auth-container">
        <header class="auth-header">
            <h1>Welcome Back</h1>
            <p>Sign in to join the conversation</p>
        </header>

        {{ if .Error }}
        <div class="error-msg">{{ .Error }}</div>
        {{ end }}

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="auth-btn">Sign In</button>
        </form>

        <footer class="auth-footer">
            <p>Don't have an account? <a href="/register">Create one</a></p>
        </footer>
    </main>
</body>
</html>
{{ end }}
