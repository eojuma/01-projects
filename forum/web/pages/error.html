{{ define "base" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/index.css">
    <title>Forum - Error {{ .StatusCode }}</title>
</head>
<body style="background-color: var(--bg-body); display: flex; flex-direction: column; min-height: 100vh;">
    <nav class="nav-bar-cont">
        <div class="display-nav-bar">
            <a href="/" class="logo">Forum</a>
        </div>
    </nav>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem;">
        <div style="text-align: center; max-width: 500px; background: white; padding: 3rem; border-radius: var(--radius); box-shadow: var(--shadow-md);">
            <h1 style="font-size: 5rem; color: var(--primary-color); margin-bottom: 1rem;">{{ .StatusCode }}</h1>
            <h2 style="margin-bottom: 1.5rem; color: var(--text-main);">Oops! Something went wrong</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 1.1rem;">{{ .Error }}</p>
            <a href="/" style="text-decoration: none;">
                <button class="btn login-btn" style="padding: 0.75rem 2.5rem; font-size: 1rem;">Back to Home</button>
            </a>
        </div>
    </main>

    <footer style="text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.9rem;">
        &copy; 2026 Forum Community
    </footer>
</body>
</html>
{{ end }}
